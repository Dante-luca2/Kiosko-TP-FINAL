<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosco</title>
    <link rel="icon" type="image/png" href="../../assets/icono.png">
    <link rel="stylesheet" href="../../../estilos.css">
    <link rel="stylesheet" href="../../componentes/slidebar.css">
</head>
<body>
    <div class="layout">
        <div id="slidebar"></div>
        <div id="contenido">
            <div class="cabecera cabecera-apilada">
                <div class="titulos">
                    <h1>Movimientos</h1>
                    <h2>Los movimientos relacionados con las compras</h2>
                </div>
                <div class="fila-acciones">
                    <div class="pestañas">
                        <a href="../ventas/ventas.html" class="pestaña">Ventas</a>
                        <a href="../compras/compras.html" class="pestaña activa">Compras</a>
                        <a href="../ajustes/ajustes.html" class="pestaña">Ajustes</a>
                    </div>
                    <button type="button" id="boton-nuevo" class="boton-primario">Registrar compra</button>
                </div>
                <div id="barra-busqueda" class="barra-busqueda">
                    <select id="select-producto-busqueda"></select>
                    <select id="select-proveedor-busqueda"></select>
                    <select id="select-empleado-busqueda"></select>
                    <button type="button" id="boton-busqueda" class="boton-secundario">Buscar</button>
                </div>
            </div>
            <div class="contenedor-tabla">
                <table class="tabla-datos">
                    <thead>
                        <tr>
                            <th scope="col">Producto</th>
                            <th scope="col">Proveedor</th>
                            <th scope="col">Empleado</th>
                            <th scope="col">Cantidad</th>
                            <th scope="col">Precio unitario</th>
                            <th scope="col">Total</th>
                            <th scope="col">Fecha</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-compras">
                        <tr>
                            <td colspan="7">Cargando compras...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modal-registrar-compra" class="modal oculto">
        <div class="modal-contenido">
            <div class="modal-cabecera">
                <h2>Agregar nueva compra</h2>
                <span id="cerrar-modal-compra" class="cerrar">&times;</span>
            </div>
            <form id="form-registrar-compra" class="formulario-modal">
                <label>Producto</label>
                <select name="producto_id" id="select-producto"></select>

                <label>Proveedor</label>
                <select name="proveedor_id" id="select-proveedor"></select>

                <label>Empleado</label>
                <select name="empleado_id" id="select-empleado"></select>

                <label>Cantidad</label>
                <input type="number" name="cantidad" min="0">

                <label>Precio unitario</label>
                <input type="number" name="precio_unitario" min="0">

                <div class="acciones-form">
                    <button type="button" id="cancelar-modal-compra" class="boton-secundario">Cancelar</button>
                    <button type="submit" class="boton-primario">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast oculto"></div>

    <script type="module" src="./compras.js"></script>
</body>
</html>
