<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosco</title>
    <link rel="stylesheet" href="../../../estilos.css">
    <link rel="stylesheet" href="../../componentes/slidebar.css">
</head>
<body>
    <div class="layout">
        <div id="slidebar"></div>
        <div id="contenido">
            <div class="cabecera">
                <div class="pestañas">
                    <a href="../ventas/ventas.html" class="pestaña activa">Ventas</a>
                    <a href="../compras/compras.html" class="pestaña">Compras</a>
                    <a href="../ajustes/ajustes.html" class="pestaña">Ajustes</a>
                </div>
                <button type="button" id="boton-nuevo" class="boton-primario">Registrar venta</button>
            </div>
            <div class="contenedor-tabla">
                <table class="tabla-datos">
                    <thead>
                        <tr>
                            <th scope="col">Producto</th>
                            <th scope="col">Empleado</th>
                            <th scope="col">Cantidad</th>
                            <th scope="col">Precio unitario</th>
                            <th scope="col">Descuento</th>
                            <th scope="col">Total</th>
                            <th scope="col">Fecha</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-ventas">
                        <tr>
                            <td colspan="8">Cargando ventas...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modal-registrar-venta" class="modal oculto">
        <div class="modal-contenido">
            <div class="modal-cabecera">
                <h2>Registrar venta</h2>
                <span id="cerrar-modal-venta" class="cerrar">&times;</span>
            </div>
            <form id="form-registrar-venta" class="formulario-modal">
                <label>Producto</label>
                <select name="producto_id" id="select-producto"></select>

                <label>Empleado</label>
                <select name="empleado_id" id="select-empleado"></select>

                <label>Cantidad</label>
                <input type="number" name="cantidad" min="0">

                <label>Precio unitario</label>
                <input type="number" name="precio_unitario" min="0">

                <label>Descuento</label>
                <input type="number" name="descuento" min="0" value="0">

                <div class="acciones-form">
                    <button type="button" id="cancelar-modal-venta" class="boton-secundario">Cancelar</button>
                    <button type="submit" class="boton-primario">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-eliminar-venta" class="modal oculto">
        <div class="modal-contenido modal-confirmacion">
            <div class="icono-alerta">!</div>
            <h2>¿Eliminar venta?</h2>
            <p id="mensaje-eliminar-venta">Esta acción no se puede deshacer.</p>
            <div class="acciones-confirmacion">
                <button type="button" id="cancelar-eliminar-venta" class="boton-secundario">Cancelar</button>
                <button type="button" id="confirmar-eliminar-venta" class="boton-peligro">Eliminar</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast oculto"></div>

    <script type="module" src="./ventas.js"></script>
</body>
</html>
