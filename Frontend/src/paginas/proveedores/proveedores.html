<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosco</title>
    <link rel="stylesheet" href="../../../estilos.css">
    <link rel="stylesheet" href="../../componentes/slidebar.css">
</head>
<body>
    <div class="layout">
        <div id="slidebar"></div>
        <div id="contenido">
            <div class="cabecera cabecera-apilada">
                <div class="titulos">
                    <h1>Proveedores</h1>
                    <h2>A quiénes les comprás la mercadería</h2>
                </div>
                <div class="fila-acciones">
                    <div id="barra-busqueda" class="barra-busqueda">
                        <input type="text" id="input-busqueda" placeholder="Buscar por nombre...">
                        <button type="button" id="boton-busqueda" class="boton-secundario">Buscar</button>
                    </div>
                    <button id="boton-nuevo" class="boton-primario">Nuevo proveedor</button>
                </div>
            </div>
            <div class="contenedor-tabla">
                <table class="tabla-datos">
                    <thead>
                        <tr>
                            <th scope="col">Nombre</th>
                            <th scope="col">Contacto</th>
                            <th scope="col">Teléfono</th> 
                            <th scope="col">Rubro</th>
                            <th scope="col">Dirección</th>
                            <th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-proveedores">
                        <tr>
                            <td colspan="6">Cargando proveedores...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modal-añadir-proveedor" class="modal oculto">
        <div class="modal-contenido">
            <div class="modal-cabecera">
                <h2>Nuevo proveedor</h2>
                <span id="cerrar-modal-añadir" class="cerrar">&times;</span>
            </div>
            <form id="form-añadir-proveedor" class="formulario-modal">
                <label>Nombre </label>
                <input type="text" name="nombre">

                <label>Contacto</label>
                <input type="text" name="contacto">

                <label>Telefono</label>
                <input type="text" name="telefono">


                <label>Rubro</label>
                <input type="text" name="rubro">

                <label>Dirección</label>
                <input type="text" name="direccion">


                <div class="acciones-form">
                    <button type="button" id="cancelar-modal-añadir" class="boton-secundario">Cancelar</button>
                    <button type="submit" class="boton-primario">Añadir</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast oculto"></div>


    <div id="modal-modificar-proveedor" class="modal oculto">
        <div class="modal-contenido">
            <div class="modal-cabecera">
                <h2>Modificar proveedor</h2>
                <span id="cerrar-modal-modificar" class="cerrar">&times;</span>
            </div>
            <form id="form-modificar-proveedor" class="formulario-modal">
                <label>Nombre </label>
                <input type="text" name="nombre">

                <label>contacto</label>
                <input type="text" name="contacto">

                <label>telefono</label>
                <input type="text" name="telefono">

                <label>Rubro</label>
                <input type="text" name="rubro">

                <label>Dirección</label>
                <input type="text" name="direccion">

                <div class="acciones-form">
                    <button type="button" id="cancelar-modal-modificar" class="boton-secundario">Cancelar</button>
                    <button type="submit" class="boton-primario">Guardar cambios</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-eliminar-proveedor" class="modal oculto">
        <div class="modal-contenido modal-confirmacion">
            <div class="icono-alerta">!</div>
            <h2>¿Eliminar proveedor?</h2>
            <p id="mensaje-eliminar">Esta acción no se puede deshacer.</p>
            <div class="acciones-confirmacion">
                <button type="button" id="cancelar-eliminar" class="boton-secundario">Cancelar</button>
                <button type="button" id="confirmar-eliminar" class="boton-peligro">Eliminar</button>
            </div>
        </div>
    </div>

    <script type="module" src="./proveedores.js"></script>
</body>
</html>
