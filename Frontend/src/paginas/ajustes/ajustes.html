<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosco</title>
    <link rel="stylesheet" href="../../../estilos.css">
    <link rel="stylesheet" href="../../componentes/slidebar.css">
</head>
<body>
    <div class="layout">
        <div id="slidebar"></div>
        <div id="contenido">
            <div class="cabecera">
                <div class="pestañas">
                    <a href="../ventas/ventas.html" class="pestaña">Ventas</a>
                    <a href="../compras/compras.html" class="pestaña">Compras</a>
                    <a href="../ajustes/ajustes.html" class="pestaña activa">Ajustes</a>
                </div>
                <button type="button" id="boton-nuevo" class="boton-primario">Registrar ajuste</button>
            </div>
            <div class="contenedor-tabla">
                <table class="tabla-datos">
                    <thead>
                        <tr>
                            <th scope="col">Producto</th>
                            <th scope="col">Empleado</th>
                            <th scope="col">Cantidad</th>
                            <th scope="col">Motivo</th>
                            <th scope="col">Fecha</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-ajustes">
                        <tr>
                            <td colspan="5">Cargando ajustes...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module" src="./ajustes.js"></script>
</body>
</html>
