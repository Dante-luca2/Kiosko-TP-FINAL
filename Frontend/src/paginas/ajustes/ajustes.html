<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosco</title>
    <link rel="stylesheet" href="../../../estilos.css">
    <link rel="stylesheet" href="../../componentes/slidebar.css">
</head>
<body>
    <div class="layout">
        <div id="slidebar"></div>
        <div id="contenido">
            <div class="cabecera cabecera-apilada">
                <div class="titulos">
                    <h1>Movimientos</h1>
                    <h2>Los movimientos relacionados con los ajustes</h2>
                </div>
                <div class="fila-acciones">
                    <div class="pestañas">
                        <a href="../ventas/ventas.html" class="pestaña">Ventas</a>
                        <a href="../compras/compras.html" class="pestaña">Compras</a>
                        <a href="../ajustes/ajustes.html" class="pestaña activa">Ajustes</a>
                    </div>
                    <button type="button" id="boton-nuevo" class="boton-primario">Registrar ajuste</button>
                </div>
                <div id="barra-busqueda" class="barra-busqueda">
                    <select id="select-producto-busqueda"></select>
                    <select id="select-empleado-busqueda"></select>
                    <button type="button" id="boton-busqueda" class="boton-secundario">Buscar</button>
                </div>
            </div>
            <div class="contenedor-tabla">
                <table class="tabla-datos">
                    <thead>
                        <tr>
                            <th scope="col">Producto</th>
                            <th scope="col">Empleado</th>
                            <th scope="col">Cantidad</th>
                            <th scope="col">Motivo</th>
                            <th scope="col">Fecha</th>
                            <th scope="col">Accion</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-ajustes">
                        <tr>
                            <td colspan="5">Cargando ajustes...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modal-registrar-ajuste" class="modal oculto">
        <div class="modal-contenido">
            <div class="modal-cabecera">
                <h2>Agregar nueva ajuste</h2>
                <span id="cerrar-modal-ajuste" class="cerrar">&times;</span>
            </div>
            <form id="form-registrar-ajuste" class="formulario-modal">
                <label>Producto</label>
                <select name="producto_id" id="select-producto"></select>

                <label>Empleado</label>
                <select name="empleado_id" id="select-empleado"></select>

                <label>Cantidad</label>
                <input type="number" name="cantidad">

                <label>Motivo</label>
                <textarea name="motivo"></textarea>

                <div class="acciones-form">
                    <button type="button" id="cancelar-modal-ajuste" class="boton-secundario">Cancelar</button>
                    <button type="submit" class="boton-primario">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast oculto"></div>

    <div id="modal-eliminar-ajuste" class="modal oculto">
        <div class="modal-contenido modal-confirmacion">
            <div class="icono-alerta">!</div>
            <h2>¿Eliminar ajuste?</h2>
            <p id="mensaje-eliminar-ajuste">Esta acción no se puede deshacer.</p>
            <div class="acciones-confirmacion">
                <button type="button" id="cancelar-eliminar-ajuste" class="boton-secundario">Cancelar</button>
                <button type="button" id="confirmar-eliminar-ajuste" class="boton-peligro">Eliminar</button>
            </div>
        </div>
    </div>

    <script type="module" src="./ajustes.js"></script>
</body>
</html>
